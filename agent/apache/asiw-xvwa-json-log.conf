# =====================================================================
# ASIW S2: Apache access log tambahan dengan format JSON
# ---------------------------------------------------------------------
# Pasang di VM Target:
#   sudo cp asiw-xvwa-json-log.conf /etc/apache2/conf-available/
#   sudo a2enconf asiw-xvwa-json-log
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# MENGAPA FILE LOG KEDUA (bukan mengubah format yang ada):
#   Decoder bawaan Wazuh 'web-accesslog' hanya memahami format NCSA
#   combined. Jika format access.log diubah menjadi JSON, seluruh rule
#   web bawaan (31100-31171) akan berhenti bekerja. Karena itu ASIW
#   menambahkan log KEDUA berformat JSON dan membiarkan access.log
#   tetap combined.
#
# FIELD YANG DIKUMPULKAN (dan alasannya, lihat XVWA_Detection_Mapping_ASIW.md):
#   remote_ip    %a   : IP sumber (korelasi per-IP, same_source_ip)
#   method       %m   : metode HTTP (memisahkan GET vs POST per modul)
#   uri          %U%q : path + query string (dasar seluruh rule T1)
#   status       %>s  : kode status (DICATAT, tapi TIDAK dipakai sebagai
#                       bukti keberhasilan, lihat mapping 1.3)
#   resp_bytes   %B   : ukuran body respons (dipakai backend untuk T2
#                       berbasis baseline, bukan oleh Wazuh)
#   duration_us  %D   : durasi respons mikrodetik (deteksi blind SQLi
#                       time-based di backend)
#   referer      %{Referer}i   : sinyal CSRF (XV-16)
#   user_agent   %{User-Agent}i: identifikasi scanner/alat
#
# PRIVASI: cookie TIDAK dicatat (mapping S2: "Jangan catat cookie mentah").
# =====================================================================

LogFormat "{\"remote_ip\":\"%a\",\"method\":\"%m\",\"uri\":\"%U%q\",\"status\":\"%>s\",\"resp_bytes\":\"%B\",\"duration_us\":\"%D\",\"referer\":\"%{Referer}i\",\"user_agent\":\"%{User-Agent}i\"}" asiw_json

# Catat HANYA request ke aplikasi XVWA agar volume log tetap terkendali
# dan agar alert tidak tercampur trafik lain pada VM yang sama.
SetEnvIf Request_URI "^/xvwa" asiw_xvwa_req=1
CustomLog ${APACHE_LOG_DIR}/xvwa_access_json.log asiw_json env=asiw_xvwa_req

