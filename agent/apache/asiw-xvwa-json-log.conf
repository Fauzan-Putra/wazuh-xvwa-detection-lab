# S3: pastikan error aplikasi tercatat (prasyarat tier T2).
# XVWA modul sqli sudah memanggil ini_set('display_errors',1) sendiri,
# tetapi log_errors harus aktif di level PHP agar error MASUK ke
# error log Apache, bukan hanya ke browser.
#
# Set di /etc/php/<versi>/apache2/php.ini:
#   log_errors = On
#   error_log  = syslog        (atau biarkan default -> error log Apache)
#   error_reporting = E_ALL
#
# Catat di laporan: display_errors=On adalah KONDISI RENTAN yang memang
# diinginkan pada lab ini dan diukur oleh SCA (S9), bukan dianggap wajar.
# ---------------------------------------------------------------------
