# =====================================================================
# ASIW S4: ModSecurity mode DetectionOnly + audit log JSON
# ---------------------------------------------------------------------
# TUJUAN: menutup FN1 (false negative sistematis).
#
# MASALAH YANG DISELESAIKAN:
#   Access log Apache TIDAK memuat body request. Pada XVWA, modul berikut
#   mengirim payload lewat POST sehingga serangannya TIDAK TERLIHAT sama
#   sekali di S1/S2:
#     - XV-01/XV-02 SQLi      (POST item, search)
#     - XV-04 XPath           (POST search)
#     - XV-09 Stored XSS      (POST name, msg)
#     - XV-11 SSRF            (POST img_url)
#     - XV-07 File upload     (POST multipart)
#   Tanpa S4 (atau Suricata S10), modul-modul ini hanya bisa mencapai
#   tier T3 lewat bukti host, tidak pernah T1.
#
# PERINGATAN PENTING:
#   Mode WAJIB DetectionOnly. PRD ASIW Bagian 3.2 menyatakan sistem ini
#   BUKAN IPS inline. Jika ModSecurity memblokir request, skenario
#   serangan E4-E8 akan gagal dan data eksperimen menjadi tidak valid.
#
# PASANG di VM Target:
#   sudo apt install -y libapache2-mod-security2
#   sudo a2enmod security2 headers
#   sudo cp asiw-modsecurity.conf /etc/modsecurity/
#   # muat setelah modsecurity.conf-recommended:
#   echo 'IncludeOptional /etc/modsecurity/asiw-modsecurity.conf' | \
#     sudo tee -a /etc/apache2/mods-enabled/security2.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# OWASP CRS (opsional, untuk skor anomali):
#   sudo apt install -y modsecurity-crs
#   Mulai dari paranoia level 1 agar FP rendah; naikkan hanya bila perlu.
# =====================================================================

SecRuleEngine DetectionOnly

# --- Inspeksi body request: inti dari penutupan FN1 -------------------
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction ProcessPartial

# --- Inspeksi body respons -------------------------------------------
# Memungkinkan tier T2 berbasis isi respons, mis. 'uid=' muncul pada
# keluaran command injection (XV-03) atau '49' pada uji SSTI (XV-19).
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# --- Audit log format JSON ------------------------------------------
# Serial (satu file) agar mudah dibaca logcollector Wazuh.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/apache2/modsec_audit.json

# --- Direktori kerja -------------------------------------------------
SecTmpDir /tmp
SecDataDir /tmp
SecUploadDir /tmp
SecUploadKeepFiles RelevantOnly
SecUploadFileMode 0600

SecDebugLog /var/log/apache2/modsec_debug.log
SecDebugLogLevel 0

SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

# =====================================================================
# Rule lokal ASIW: paksa transaksi XVWA selalu masuk audit log,
# termasuk yang berstatus 200. Tanpa ini, SecAuditLogRelevantStatus
# di atas hanya menyimpan 4xx/5xx, sedangkan XVWA justru membalas 200
# untuk hampir semua serangan (lihat XVWA_Detection_Mapping_ASIW.md 1.3).
#
# Rentang ID 1000xxx dipakai agar tidak bertabrakan dengan CRS
# (CRS memakai 9xxxxx dan 2xxxxx).
# =====================================================================
SecRule REQUEST_URI "@beginsWith /xvwa/" \
    "id:1000001,\
     phase:2,\
     pass,\
     log,\
     auditlog,\
     msg:'ASIW: XVWA transaction captured for analysis',\
     tag:'asiw',\
     tag:'xvwa'"

# Tandai POST ke modul XVWA yang payload-nya hanya ada di body.
SecRule REQUEST_METHOD "@streq POST" \
    "id:1000002,\
     phase:2,\
     pass,\
     log,\
     auditlog,\
     msg:'ASIW: XVWA POST body captured (closes FN1)',\
     tag:'asiw',\
     tag:'xvwa_post',\
     chain"
    SecRule REQUEST_URI "@rx ^/xvwa/vulnerabilities/(sqli|sqli_blind|xpath|stored_xss|ssrf_xspa|fileupload|formula_injection)/"
